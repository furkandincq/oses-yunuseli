<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oses Detay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .oses-bg-red { background-color: #CB333B; }
        .detail-img-box { width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; background: white; border-bottom: 1px solid #eee; }
        .detail-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="content" class="max-w-xl mx-auto bg-white min-h-screen shadow-lg"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const items = JSON.parse(localStorage.getItem('osesMenu')) || [];
        const item = items[params.get('id')];
        if(item) {
            document.getElementById('content').innerHTML = `
                <div class="relative"><div class="detail-img-box"><img src="${item.img}"></div>
                <button onclick="history.back()" class="absolute top-6 left-6 bg-white shadow-md p-3 rounded-full"><svg class="w-6 h-6 text-[#97D700]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg></button></div>
                <div class="p-8"><h1 class="text-2xl font-black text-[#4c7c00] uppercase mb-2">${item.name}</h1>
                <div class="text-3xl font-black text-[#CB333B] mb-6">₺${item.price},00</div>
                <div class="border-t pt-6"><h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Ürün Açıklaması</h2><p class="text-gray-600 leading-relaxed text-lg">${item.desc || 'Açıklama mevcut değil.'}</p></div>
                <button onclick="history.back()" class="w-full oses-bg-red text-white py-4 rounded-lg font-bold text-lg mt-12 uppercase">Listeye Dön</button></div>`;
        }
    </script>
</body>
</html>
