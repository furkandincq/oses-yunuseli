<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oses Şifre Güncelleme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if(sessionStorage.getItem('oses_auth') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-6 font-sans">
    <div class="bg-slate-800 p-8 rounded-[2rem] shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-8">
            <svg class="w-16 h-16 text-yellow-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            <h2 class="text-yellow-500 font-black text-xl italic uppercase">Güvenlik Ayarları</h2>
            <p class="text-slate-400 text-xs mt-2 uppercase">Panel Şifresini Değiştir</p>
        </div>
        <div class="space-y-4">
            <input type="password" id="oldPass" placeholder="Mevcut Eski Şifre" class="w-full p-4 bg-slate-900 text-white border border-slate-600 rounded-2xl outline-none focus:ring-2 focus:ring-yellow-500 tracking-widest text-center">
            <input type="password" id="newPass1" placeholder="Yeni Şifre" class="w-full p-4 bg-slate-900 text-white border border-slate-600 rounded-2xl outline-none focus:ring-2 focus:ring-[#97D700] tracking-widest text-center">
            <input type="password" id="newPass2" placeholder="Yeni Şifre (Tekrar)" class="w-full p-4 bg-slate-900 text-white border border-slate-600 rounded-2xl outline-none focus:ring-2 focus:ring-[#97D700] tracking-widest text-center">
            <button onclick="changePassword()" class="w-full bg-yellow-600 text-white py-4 rounded-2xl font-black tracking-widest shadow-xl hover:bg-yellow-500 transition uppercase mt-4">Şifreyi Güncelle</button>
            <button onclick="location.href='panel.html'" class="w-full text-slate-500 font-bold text-xs uppercase mt-2 hover:text-white transition">İptal Et ve Panele Dön</button>
        </div>
    </div>
    <script>
        const DB_URL = "https://oses-yunuseli-default-rtdb.firebaseio.com/oses.json";
        async function changePassword() {
            const oldP = document.getElementById('oldPass').value;
            const newP1 = document.getElementById('newPass1').value;
            const newP2 = document.getElementById('newPass2').value;
            if(!oldP || !newP1 || !newP2) return alert("Lütfen tüm alanları doldurunuz.");
            if(newP1 !== newP2) return alert("Girdiğiniz yeni şifreler birbiriyle uyuşmuyor!");
            if(newP1.length < 4) return alert("Yeni şifreniz en az 4 karakter olmalıdır.");
            try {
                const res = await fetch(DB_URL);
                const data = await res.json() || {};
                const currentPass = data.adminPass || "oses16";
                if(oldP !== currentPass) return alert("Mevcut şifrenizi yanlış girdiniz!");
                
                // Mevcut verileri koruyarak sadece şifreyi güncelle
                const payload = { ...data, adminPass: newP1 };
                
                await fetch(DB_URL, { method: 'PUT', body: JSON.stringify(payload) });
                alert("Şifreniz başarıyla değiştirilmiştir!");
                window.location.href = 'panel.html';
            } catch (e) {
                alert("Veritabanı bağlantı hatası!");
            }
        }
    </script>
</body>
</html>
