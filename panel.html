<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oses Admin | Akıllı Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        .oses-bg-red { background-color: #CB333B; }
        .oses-bg-green { background-color: #97D700; }
        .oses-red { color: #CB333B; }
        .category-content { transition: max-height 0.4s ease-in-out; overflow: hidden; }
        .collapsed { max-height: 0; }
        .expanded { max-height: 5000px; }
        .checkbox-custom { width: 20px; height: 20px; accent-color: #CB333B; cursor: pointer; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; border-radius: 20px; }
    </style>
    <script>
        if(sessionStorage.getItem('oses_auth') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body class="bg-slate-900 text-white p-4 md:p-10 font-sans">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b-2 border-[#97D700] pb-4">
            <img src="https://www.oses.com.tr/assets/images/oses.png" class="h-12 md:h-20">
            <div class="text-right uppercase">
                <span class="block text-[10px] text-slate-500 font-bold tracking-widest uppercase">YUNUSELİ ŞUBE</span>
                <span class="oses-red font-black italic">ADMİN YÖNETİMİ</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                <h3 class="text-yellow-500 font-black italic mb-4 uppercase text-sm">Teslimat & Ödeme Ayarları</h3>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Min. Sipariş (₺)</label>
                        <input type="number" id="minOrderAmount" class="w-full p-3 mt-1 bg-slate-900 border border-slate-700 rounded-xl outline-none text-sm text-white" placeholder="Örn: 100">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">KM Başı Ücret (₺)</label>
                        <input type="number" id="perKmFee" class="w-full p-3 mt-1 bg-slate-900 border border-slate-700 rounded-xl outline-none text-sm text-white" placeholder="Örn: 5">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tahmini Teslimat Süresi</label>
                    <input type="text" id="deliveryTime" class="w-full p-3 mt-1 bg-slate-900 border border-slate-700 rounded-xl outline-none text-sm text-white" placeholder="Örn: 30-45 dk">
                </div>
                <div class="mb-6 flex items-center gap-3 bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <input type="checkbox" id="isBusy" class="w-5 h-5 accent-red-500 rounded cursor-pointer">
                    <label for="isBusy" class="text-xs font-bold text-red-400 uppercase cursor-pointer">Şu An Yoğunluk Var (Sepette Kırmızı Uyarı)</label>
                </div>

                <label class="text-[10px] font-bold text-slate-400 uppercase block mb-2">Ödeme Seçenekleri</label>
                <div id="payment-list" class="space-y-2 mb-3"></div>
                <div class="flex gap-2">
                    <input type="text" id="newPaymentName" class="flex-1 p-3 bg-slate-900 border border-slate-700 rounded-xl outline-none text-sm" placeholder="Yeni Ekle (Örn: Sodexo)">
                    <button onclick="addPayment()" class="bg-green-600 px-5 rounded-xl font-bold text-xs uppercase hover:bg-green-500 transition">Ekle</button>
                </div>
                
                <button onclick="saveSettings()" class="w-full mt-6 oses-bg-red py-3 rounded-xl font-black uppercase tracking-widest shadow-xl text-sm hover:bg-red-700 transition">Ayarları Kaydet</button>
            </div>

            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl flex flex-col">
                <h2 class="text-yellow-500 font-black italic mb-4 uppercase text-sm border-b border-slate-700 pb-2">Kategori Yönetimi</h2>
                <div class="flex gap-2 mb-4 mt-2">
                    <input type="text" id="new-cat-name" placeholder="Yeni Kategori Adı" class="flex-1 p-3 bg-slate-900 border border-slate-700 rounded-xl outline-none text-sm focus:border-[#97D700]">
                    <button onclick="addCategory()" class="oses-bg-green px-6 rounded-xl font-black uppercase text-xs shadow-xl hover:opacity-80 transition">EKLE</button>
                </div>
                <div id="category-list-admin" class="grid grid-cols-1 gap-2 overflow-y-auto max-h-[250px] pr-2 custom-scrollbar"></div>
            </div>

        </div>

        <div class="bg-slate-800 p-6 rounded-[2rem] shadow-2xl mb-12 border border-slate-700">
            <h3 class="text-yellow-500 font-black italic mb-4 uppercase text-sm">Ürün Ekle / Düzenle</h3>
            <div class="flex flex-col md:flex-row gap-6">
                <div class="flex flex-col items-center gap-2">
                    <div class="w-24 h-24 border-2 border-dashed border-slate-600 rounded-xl overflow-hidden bg-slate-900 flex items-center justify-center">
                        <img id="img-preview" src="https://www.oses.com.tr/assets/images/oses.png" class="max-w-full max-h-full object-contain">
                    </div>
                </div>
                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="edit-id" value="">
                    
                    <select id="cat" class="w-full p-3 bg-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-[#97D700]"></select>
                    
                    <input type="text" id="n" placeholder="Ürün Adı" class="w-full p-3 bg-slate-700 rounded-xl outline-none">
                    
                    <div class="col-span-1 md:col-span-2 grid grid-cols-3 gap-2">
                        <input type="number" id="oldP" placeholder="Eski Fiyat ₺" class="w-full p-3 bg-slate-700 rounded-xl outline-none" title="Eğer indirim yoksa boş bırakın">
                        <input type="number" id="disc" placeholder="% İndirim" class="w-full p-3 bg-slate-700 rounded-xl outline-none text-[#97D700] font-bold">
                        <input type="number" id="p" placeholder="Net Satış ₺" class="w-full p-3 bg-slate-700 rounded-xl outline-none border border-[#97D700] text-white font-bold">
                    </div>

                    <input type="text" id="removables" placeholder="Çıkarılabilir Malzemeler (Virgülle ayırın: Soğan, Domates, Acı)" class="w-full p-3 bg-slate-700 rounded-xl outline-none col-span-1 md:col-span-2 text-sm text-yellow-300 placeholder-slate-400">
                    <input type="text" id="extras" placeholder="Ekstralar (İsim:Fiyat şeklinde: Çift Lavaş:7, Burger Sos:10)" class="w-full p-3 bg-slate-700 rounded-xl outline-none col-span-1 md:col-span-2 text-sm text-green-300 placeholder-slate-400">

                    <input type="text" id="i" oninput="document.getElementById('img-preview').src = this.value || 'https://www.oses.com.tr/assets/images/oses.png'" placeholder="Resim URL" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl outline-none col-span-1 md:col-span-2">
                    <textarea id="d" rows="2" placeholder="Açıklama" class="w-full p-3 bg-slate-700 rounded-xl outline-none col-span-1 md:col-span-2"></textarea>
                    
                    <div class="col-span-1 md:col-span-2 flex gap-2">
                        <button id="main-btn" onclick="saveProduct()" class="flex-1 oses-bg-red py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl hover:bg-red-700 transition">BULUTA KAYDET</button>
                        <button id="cancel-btn" onclick="location.reload()" class="hidden bg-slate-600 px-6 py-4 rounded-2xl font-bold uppercase text-xs hover:bg-slate-500 transition">İPTAL</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="master-category-container" class="space-y-4"></div>

        <div class="mt-20 p-6 bg-slate-800 rounded-2xl border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
            <span class="text-xs font-bold text-slate-500 uppercase">Sistem İşlemleri</span>
            <div class="flex flex-wrap gap-2">
                <button onclick="location.href='change-password.html'" class="bg-yellow-600 px-4 py-3 rounded-lg text-[10px] font-bold uppercase">ŞİFRE DEĞİŞTİR</button>
                <button onclick="exportBackup()" class="bg-blue-600 px-4 py-3 rounded-lg text-[10px] font-bold uppercase">YEDEK AL</button>
                <button onclick="document.getElementById('importFile').click()" class="bg-green-600 px-4 py-3 rounded-lg text-[10px] font-bold uppercase">YÜKLE</button>
                <input type="file" id="importFile" class="hidden" onchange="importBackup(this)">
                <button onclick="logout()" class="bg-red-800 px-4 py-3 rounded-lg text-[10px] font-bold uppercase border border-red-500">ÇIKIŞ YAP</button>
            </div>
        </div>
    </div>

    <script>
        const DB_URL = "https://oses-yunuseli-default-rtdb.firebaseio.com/oses.json";
        let items = [];
        let categories = [];
        let adminPass = "oses16";

        let paymentMethods = [
            {name: "Kapıda Nakit", active: true},
            {name: "Kapıda Kredi Kartı", active: true}
        ];
        let deliverySettings = { time: "30-45 Dk", isBusy: false, minOrderAmount: 0, perKmFee: 0 };

        const oldPInput = document.getElementById('oldP');
        const pInput = document.getElementById('p');
        const discInput = document.getElementById('disc');

        function updateDiscount() {
            let oldP = parseFloat(oldPInput.value);
            let p = parseFloat(pInput.value);
            if(oldP > 0 && p > 0 && oldP > p) {
                let disc = ((oldP - p) / oldP) * 100;
                discInput.value = Math.round(disc);
            } else if (!pInput.value || p >= oldP) {
                discInput.value = '';
            }
        }

        function updatePrice() {
            let oldP = parseFloat(oldPInput.value);
            let disc = parseFloat(discInput.value);
            if(oldP > 0 && disc > 0 && disc <= 100) {
                let p = oldP - (oldP * disc / 100);
                pInput.value = Math.round(p);
            }
        }

        oldPInput.addEventListener('input', () => { if(discInput.value) updatePrice(); else updateDiscount(); });
        pInput.addEventListener('input', updateDiscount);
        discInput.addEventListener('input', updatePrice);

        async function loadData() {
            try {
                const res = await fetch(DB_URL);
                const data = await res.json();
                if(data) {
                    items = data.items || [];
                    if(data.categories) {
                        categories = data.categories;
                    } else if(data.catOrder) {
                        const oldNames = {"çiğköfte": "ÇİĞ KÖFTELER", "dürüm": "DÜRÜMLER", "tatlı": "TATLILAR", "içecek": "İÇECEKLER", "extra": "EKSTRALAR", "kampanya": "KAMPANYALAR"};
                        categories = data.catOrder.map(id => ({ id: id, name: oldNames[id] || id.toUpperCase() }));
                    } else {
                        categories = [{id: "çiğköfte", name: "ÇİĞ KÖFTELER"}];
                    }
                    adminPass = data.adminPass || "oses16";
                    if(data.paymentMethods) paymentMethods = data.paymentMethods;
                    if(data.deliverySettings) deliverySettings = data.deliverySettings;
                }
                
                renderSettings(); 
                renderCategoryAdmin();
                renderAll();
            } catch(e) { console.error(e); }
        }

        async function sync() {
            await fetch(DB_URL, { 
                method: 'PATCH', 
                body: JSON.stringify({ items, categories, adminPass, paymentMethods, deliverySettings }) 
            });
        }

        function renderSettings() {
            document.getElementById('deliveryTime').value = deliverySettings.time || "";
            document.getElementById('isBusy').checked = deliverySettings.isBusy || false;
            document.getElementById('minOrderAmount').value = deliverySettings.minOrderAmount || 0;
            document.getElementById('perKmFee').value = deliverySettings.perKmFee || 0;

            document.getElementById('payment-list').innerHTML = paymentMethods.map((p, idx) => `
                <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg border border-slate-700 transition">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${p.active ? 'checked' : ''} onchange="togglePayment(${idx})" class="w-4 h-4 accent-[#97D700] rounded">
                        <span class="text-sm font-bold ${p.active ? 'text-white' : 'text-slate-500 line-through'}">${p.name}</span>
                    </div>
                    <button onclick="deletePayment(${idx})" class="text-red-500 hover:text-red-400 p-1 bg-red-500/10 rounded"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg></button>
                </div>
            `).join('');
        }

        async function saveSettings() {
            deliverySettings.time = document.getElementById('deliveryTime').value.trim();
            deliverySettings.isBusy = document.getElementById('isBusy').checked;
            deliverySettings.minOrderAmount = parseFloat(document.getElementById('minOrderAmount').value) || 0;
            deliverySettings.perKmFee = parseFloat(document.getElementById('perKmFee').value) || 0;
            await sync();
            alert("Ayarlar başarıyla kaydedildi!");
        }

        function addPayment() {
            const val = document.getElementById('newPaymentName').value.trim();
            if(!val) return;
            paymentMethods.push({name: val, active: true});
            document.getElementById('newPaymentName').value = '';
            renderSettings();
        }

        function togglePayment(idx) {
            paymentMethods[idx].active = !paymentMethods[idx].active;
        }

        function deletePayment(idx) {
            if(confirm("Bu ödeme seçeneğini silmek istediğinize emin misiniz?")) {
                paymentMethods.splice(idx, 1);
                renderSettings();
            }
        }

        function renderCategoryAdmin() {
            const list = document.getElementById('category-list-admin');
            const select = document.getElementById('cat');
            list.innerHTML = '';
            select.innerHTML = '';

            categories.forEach(c => {
                list.innerHTML += `
                    <div class="bg-slate-700 px-3 py-2 rounded-lg flex items-center justify-between gap-2 border border-slate-600">
                        <span class="text-[10px] font-bold uppercase truncate">${c.name}</span>
                        <button onclick="deleteCategory('${c.id}')" class="text-red-500 hover:text-white hover:bg-red-500 p-1 rounded-md transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                `;
                select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
        }

        async function addCategory() {
            const input = document.getElementById('new-cat-name');
            const name = input.value.trim();
            if(!name) return alert("Kategori adı boş olamaz!");
            
            const id = name.toLowerCase().replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u').replace(/[^a-z0-9]/g, '');
                
            if(categories.find(c => c.id === id)) return alert("Bu kategori zaten var!");
            
            categories.push({ id, name });
            input.value = '';
            await sync();
            renderCategoryAdmin();
            renderAll();
        }

        async function deleteCategory(id) {
            if(items.some(it => it.cat === id)) return alert("Bu kategoriye ait ürünler var! Silmeden önce ürünleri silin veya kategorilerini değiştirin.");
            if(confirm("Bu kategoriyi kalıcı olarak silmek istediğinize emin misiniz?")) {
                categories = categories.filter(c => c.id !== id);
                await sync();
                renderCategoryAdmin();
                renderAll();
            }
        }

        function renderAll() {
            const container = document.getElementById('master-category-container');
            container.innerHTML = '';
            categories.forEach(catObj => {
                const catKey = catObj.id;
                const catName = catObj.name;
                const catItems = items.filter(it => it.cat === catKey);
                const section = document.createElement('div');
                section.className = "category-block bg-slate-800 rounded-3xl border border-slate-700 overflow-hidden mb-4";
                section.setAttribute('data-cat', catKey);
                section.innerHTML = `
                    <div class="flex justify-between items-center p-5 bg-slate-800/90 border-b border-slate-700 cursor-pointer" onclick="toggleCategory('${catKey}')">
                        <div class="flex items-center gap-3">
                            <div class="drag-handle-cat text-[#97D700] cursor-move"><svg class="w-5 h-5 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-width="3"></path></svg></div>
                            <h3 class="font-black text-sm uppercase italic">${catName} (${catItems.length})</h3>
                        </div>
                        <div class="flex gap-4 items-center">
                            <button onclick="event.stopPropagation(); deleteSelected('${catKey}')" class="text-[10px] font-bold text-red-500 border border-red-500/20 px-2 py-1 rounded-lg uppercase hover:bg-red-500 hover:text-white">SEÇİLİLERİ SİL</button>
                            <svg id="icon-${catKey}" class="w-5 h-5 text-slate-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                    <div id="content-${catKey}" class="category-content collapsed bg-slate-900/20 px-5 pb-5">
                        <div id="list-${catKey}" class="space-y-2 pt-4">
                            ${catItems.map(it => `
                                <div class="flex justify-between items-center bg-slate-800 p-3 rounded-2xl border border-slate-700" data-id="${it.id}">
                                    <div class="flex items-center gap-4">
                                        <input type="checkbox" data-cat="${catKey}" value="${it.id}" class="checkbox-custom">
                                        <div class="relative">
                                            <img src="${it.img || ''}" class="w-10 h-10 rounded-lg object-cover bg-slate-900">
                                            ${it.discountPercent ? `<span class="absolute -top-1 -right-1 bg-red-600 text-white text-[8px] font-black px-1 rounded">%${it.discountPercent}</span>` : ''}
                                        </div>
                                        <div class="text-[11px] font-bold uppercase flex flex-col">
                                            <span>${it.name} - ${it.oldPrice ? `<span class="text-slate-500 line-through text-[9px]">${it.oldPrice}₺</span> ` : ''}<span class="text-[#97D700]">${it.price}₺</span></span>
                                            ${it.removables || it.extras ? `<span class="text-yellow-500 text-[9px] mt-1">Özelleştirilebilir Ürün</span>` : ''}
                                        </div>
                                    </div>
                                    <button onclick="editProduct('${it.id}')" class="text-blue-400 font-black text-[10px] bg-blue-500/10 px-3 py-2 rounded-xl hover:bg-blue-500 hover:text-white transition">DÜZENLE</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                container.appendChild(section);
                new Sortable(document.getElementById(`list-${catKey}`), { animation: 150, onEnd: saveItemOrder });
            });
            new Sortable(container, { animation: 200, handle: '.drag-handle-cat', onEnd: saveCategoryOrder });
        }

        function toggleCategory(k) {
            const c = document.getElementById(`content-${k}`);
            c.classList.toggle('collapsed');
            c.classList.toggle('expanded');
        }

        async function saveProduct() {
            const eid = document.getElementById('edit-id').value;
            const newItem = { 
                id: eid || Date.now().toString(), 
                cat: document.getElementById('cat').value, 
                name: document.getElementById('n').value, 
                oldPrice: document.getElementById('oldP').value || null,
                discountPercent: document.getElementById('disc').value || null,
                price: document.getElementById('p').value, 
                removables: document.getElementById('removables').value,
                extras: document.getElementById('extras').value,
                img: document.getElementById('i').value, 
                desc: document.getElementById('d').value 
            };
            if(!newItem.name || !newItem.price) return alert("Ürün adı ve Satış Fiyatı alanları zorunludur!");
            if(eid) items = items.map(it => it.id === eid ? newItem : it); else items.push(newItem);
            await sync();
            location.reload();
        }

        function editProduct(id) {
            const it = items.find(x => x.id === id);
            document.getElementById('edit-id').value = id;
            document.getElementById('cat').value = it.cat;
            document.getElementById('n').value = it.name;
            document.getElementById('oldP').value = it.oldPrice || '';
            document.getElementById('disc').value = it.discountPercent || '';
            document.getElementById('p').value = it.price;
            document.getElementById('removables').value = it.removables || '';
            document.getElementById('extras').value = it.extras || '';
            document.getElementById('i').value = it.img;
            document.getElementById('d').value = it.desc;
            document.getElementById('img-preview').src = it.img || 'https://www.oses.com.tr/assets/images/oses.png';
            document.getElementById('main-btn').innerText = "GÜNCELLE";
            document.getElementById('cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        async function deleteSelected(cat) {
            const sel = Array.from(document.querySelectorAll(`input[type="checkbox"][data-cat="${cat}"]:checked`)).map(c => c.value);
            if(!sel.length) return alert("Seçim yok!");
            if(confirm("Silinsin mi?")) { items = items.filter(it => !sel.includes(it.id)); await sync(); renderAll(); }
        }

        async function saveCategoryOrder() {
            const newOrderIds = Array.from(document.querySelectorAll('.category-block')).map(b => b.getAttribute('data-cat'));
            categories = newOrderIds.map(id => categories.find(c => c.id === id));
            await sync();
        }

        async function saveItemOrder() {
            const final = [];
            categories.forEach(catObj => {
                const list = document.getElementById(`list-${catObj.id}`);
                if(list) list.querySelectorAll('[data-id]').forEach(r => final.push(items.find(it => it.id === r.getAttribute('data-id'))));
            });
            items = final;
            await sync();
        }

        function exportBackup() {
            const blob = new Blob([JSON.stringify({items, categories, paymentMethods, deliverySettings, adminPass})], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'oses-bulut-yedek.json'; a.click();
        }

        function importBackup(input) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const d = JSON.parse(e.target.result);
                items = d.items || items; 
                categories = d.categories || d.catOrder?.map(id => ({id, name: id.toUpperCase()})) || categories;
                adminPass = d.adminPass || adminPass;
                paymentMethods = d.paymentMethods || paymentMethods;
                deliverySettings = d.deliverySettings || deliverySettings;
                
                await sync();
                location.reload();
            };
            reader.readAsText(input.files[0]);
        }
        
        function logout() {
            sessionStorage.removeItem('oses_auth');
            window.location.href = 'index.html';
        }

        window.onload = loadData;
    </script>
</body>
</html>
