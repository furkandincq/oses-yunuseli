<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oses Yunuseli Dijital Menü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #ffffff; font-family: sans-serif; }
        .oses-green { color: #97D700; }
        .oses-bg-green { background-color: #97D700; }
        .oses-red { color: #CB333B; }
        .nav-link { background-color: #97D700; color: white; transition: 0.2s; font-weight: 600; text-transform: capitalize; }
        .nav-link.active { background-color: #ffffff; color: #97D700; border-bottom: 3px solid #97D700; border-radius: 0; }
        .img-box { width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; background: #fff; }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body class="pb-20">
    <header class="oses-bg-green shadow-md sticky top-0 z-50 text-white">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <img src="https://www.oses.com.tr/assets/images/oses.png" style="height: 80px;">
                <div class="border-l-2 border-white/30 pl-4">
                    <h2 class="oses-red font-black text-xl italic uppercase tracking-tighter bg-white px-3 py-0.5 rounded-tr-xl">YUNUSELİ ŞUBE</h2>
                    <p class="text-[13px] font-black mt-1 leading-tight uppercase">YUNUSELİ MAH. FUAT KUŞÇUOĞLU CAD.<br>NO:175/C</p>
                </div>
            </div>
            <div class="flex flex-col items-center bg-white px-8 py-2 rounded-2xl shadow-xl">
                <div class="flex items-center gap-4">
                    <img src="https://media.istockphoto.com/id/2112173239/tr/vekt%C3%B6r/courier-man-with-quick-fast-motorcycle-scooter-for-delivery-order-service-icon-illustration.jpg?s=612x612&w=0&k=20&c=W5Vv5_RFLb8k5NjXHqqPvqPf4qJambXHn2PiLAOFXFs=" class="h-14 w-14 object-contain">
                    <span class="font-black text-xl tracking-tighter uppercase italic oses-red">ALO PAKET</span>
                </div>
                <a href="tel:05412201665" class="text-2xl font-black text-gray-800">0(541) 220 1665</a>
            </div>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-black oses-green mb-8 uppercase tracking-tight">ÜRÜNLER</h1>
        <div class="flex flex-wrap gap-1 bg-[#97D700] p-1 rounded-sm mb-10 shadow-sm" id="category-bar">
            <button onclick="filterCategory('all')" class="nav-link flex-1 py-3 px-2 active">Tümü</button>
            <button onclick="filterCategory('çiğköfte')" class="nav-link flex-1 py-3 px-2">Çiğ Köfteler</button>
            <button onclick="filterCategory('dürüm')" class="nav-link flex-1 py-3 px-2">Dürümler</button>
            <button onclick="filterCategory('tatlı')" class="nav-link flex-1 py-3 px-2">Tatlılar</button>
            <button onclick="filterCategory('içecek')" class="nav-link flex-1 py-3 px-2">İçecekler</button>
            <button onclick="filterCategory('extra')" class="nav-link flex-1 py-3 px-2">Ekstralar</button>
            <button onclick="filterCategory('kampanya')" class="nav-link flex-1 py-3 px-2">Kampanyalar</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8" id="menu-container"></div>
    </div>

    <script>
        let currentCategory = 'all';
        function renderMenu() {
            const items = JSON.parse(localStorage.getItem('osesMenu')) || [];
            const catOrder = JSON.parse(localStorage.getItem('osesCatOrder')) || ["çiğköfte", "dürüm", "tatlı", "içecek", "extra", "kampanya"];
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            let displayItems = [];
            if (currentCategory === 'all') {
                catOrder.forEach(cat => { displayItems = [...displayItems, ...items.filter(it => it.cat === cat)]; });
            } else {
                displayItems = items.filter(i => i.cat === currentCategory);
            }
            displayItems.forEach((item) => {
                const globalIdx = items.indexOf(item);
                container.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden cursor-pointer hover:scale-[1.02] transition-transform p-4" onclick="location.href='detay.html?id=${globalIdx}'">
                        <div class="img-box"><img src="${item.img || 'https://www.oses.com.tr/assets/images/oses.png'}" onerror="this.src='https://www.oses.com.tr/assets/images/oses.png'"></div>
                        <div class="mt-6 text-center">
                            <h3 class="text-sm font-bold text-[#4c7c00] uppercase mb-1 min-h-[32px]">${item.name}</h3>
                            <p class="text-[10px] text-gray-400 line-clamp-2 mb-3 h-8">${item.desc || ''}</p>
                            <div class="text-xl font-black oses-red">₺${item.price},00</div>
                        </div>
                    </div>`;
            });
        }
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.nav-link').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(cat));
            });
            renderMenu();
        }
        window.onload = renderMenu;
    </script>
</body>
</html>
